name: tests
on: [push, pull_request]
jobs:
  unittest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt usd-core ifcopenshell  # real USD and IFC parsers for the export tests
      # the Excel pack is not in git (licence), so the PostgresBackend tests skip here; everything else runs
      - run: python -m unittest discover tests -v
