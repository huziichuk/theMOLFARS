<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Valmet Industrial Metaverse — Field-Service Copilot demo</title>
<style>
  :root { --bg:#0f1115; --panel:#171a21; --line:#2a2f3a; --text:#e6e8ec; --mute:#8b93a3; --ok:#3ecf6e; --warn:#f2b636; --bad:#ff4d4d; --acc:#4ea1ff; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font:14px/1.45 system-ui, sans-serif; display:flex; height:100vh; overflow:hidden; }
  #view { flex:1; position:relative; }
  #view > canvas { display:block; width:100% !important; height:100% !important; }
  #hud { position:absolute; top:12px; left:12px; display:flex; gap:6px; flex-wrap:wrap; z-index:10; }
  #hud button, #hud label { background:#000a; color:var(--text); border:1px solid var(--line); border-radius:6px; padding:6px 10px; cursor:pointer; font:inherit; }
  #hud button[aria-pressed="true"] { border-color:var(--acc); color:var(--acc); }
  #status { position:absolute; bottom:12px; left:12px; background:#000a; padding:6px 10px; border-radius:6px; color:var(--mute); z-index:10; }
  #help { position:absolute; bottom:12px; right:12px; background:#000a; padding:6px 10px; border-radius:6px; color:var(--mute); font-size:12px; z-index:10; }
  aside { width:400px; background:var(--panel); border-left:1px solid var(--line); display:flex; flex-direction:column; }
  aside h2 { font-size:13px; text-transform:uppercase; letter-spacing:.06em; color:var(--mute); margin:14px 14px 6px; }
  #nearby { margin:0 14px; padding:0; list-style:none; max-height:30vh; overflow:auto; }
  #nearby li { display:flex; justify-content:space-between; gap:8px; padding:5px 6px; border-bottom:1px solid var(--line); cursor:pointer; }
  #nearby li:hover { background:#ffffff08; }
  .chip { font-size:11px; padding:1px 6px; border-radius:10px; white-space:nowrap; }
  .healthy { background:#3ecf6e22; color:var(--ok); } .warn { background:#f2b63622; color:var(--warn); } .bad { background:#ff4d4d22; color:var(--bad); } .info { background:#4ea1ff22; color:var(--acc); } .none { background:#ffffff11; color:var(--mute); }
  #chat { flex:1; overflow:auto; margin:0 14px; display:flex; flex-direction:column; gap:8px; }
  .msg { padding:8px 10px; border-radius:8px; background:#ffffff08; white-space:normal; }
  .msg.user { background:#4ea1ff1f; align-self:flex-end; max-width:85%; }
  .msg code { background:#ffffff14; padding:0 3px; border-radius:3px; }
  .msg .cite { color:var(--acc); }
  form { display:flex; gap:6px; padding:12px 14px; border-top:1px solid var(--line); }
  form input { flex:1; background:#0f1115; color:var(--text); border:1px solid var(--line); border-radius:6px; padding:8px; font:inherit; }
  form button { background:var(--acc); color:#000; border:0; border-radius:6px; padding:8px 12px; font:inherit; cursor:pointer; }
  .label3d { font:11px system-ui; padding:2px 6px; border-radius:4px; background:#000c; border-left:3px solid var(--mute); color:#fff; pointer-events:auto; cursor:pointer; white-space:nowrap; }
  .label3d.healthy { border-color:var(--ok); } .label3d.warn { border-color:var(--warn); } .label3d.bad { border-color:var(--bad); font-weight:600; } .label3d.info { border-color:var(--acc); }
  #gscan-overlay { position:absolute; inset:0; pointer-events:none; z-index:5; }
  .gbox { position:absolute; border:2px solid var(--acc); border-radius:4px; background:#4ea1ff14; pointer-events:auto; cursor:pointer; }
  .gbox span { position:absolute; top:-20px; left:-2px; background:var(--acc); color:#000; font:600 11px system-ui; padding:1px 6px; border-radius:3px; white-space:nowrap; }
  #bim-panel { position:absolute; bottom:46px; left:12px; background:#11141ce8; border:1px solid var(--line); border-radius:8px; padding:6px 8px; z-index:10; box-shadow:0 6px 20px #0009; user-select:none; }
  #bim-head { display:flex; justify-content:space-between; align-items:center; gap:8px; font-size:11px; color:var(--mute); margin-bottom:4px; }
  #bim-head b { color:var(--text); letter-spacing:.03em; }
  #bim-head button { background:transparent; color:var(--mute); border:1px solid var(--line); border-radius:4px; padding:1px 6px; font-size:10px; cursor:pointer; }
  #bim-canvas { display:block; border-radius:4px; cursor:crosshair; background:#0b0d12; }
  #bim-legend { display:flex; gap:8px; flex-wrap:wrap; font-size:10px; color:var(--mute); margin-top:4px; }
  #bim-legend span::before { content:""; display:inline-block; width:7px; height:7px; border-radius:50%; margin-right:4px; vertical-align:middle; }
  #bim-legend .l-bad::before { background:var(--bad); }
  #bim-legend .l-warn::before { background:var(--warn); }
  #bim-legend .l-ok::before { background:var(--ok); }
  #bim-legend .l-eq::before { background:var(--acc); }
  #bim-legend .l-pipe::before { background:#2d6896; }
  #loading { position:absolute; inset:0; display:grid; place-items:center; background:#0f1115e0; font-size:16px; }
</style>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/",
  "@sparkjsdev/spark": "https://sparkjs.dev/releases/spark/2.4.0/spark.module.js"
} }
</script>
</head>
<body>
<div id="view">
  <div id="hud">
    <button id="play">▶ Start mission</button>
    <button data-mode="follow" aria-pressed="true">Follow</button>
    <button data-mode="orbit">Orbit</button>
    <button data-mode="walk">Walk (WASD)</button>
    <button id="all" aria-pressed="false">All frames</button>
    <button id="bim-btn" aria-pressed="true">🗺️ BIM plan</button>
    <button id="ai">AI labels (CLIP)</button>
    <button id="gemini-hud" style="border-color:var(--acc);color:var(--acc)">✨ Gemini scan view</button>
    <label>Open splat… <input id="file" type="file" accept=".ply,.spz,.splat,.ksplat,.sog" hidden></label>
  </div>
  <div id="gscan-overlay"></div>
  <div id="bim-panel">
    <div id="bim-head">
      <span><b>BIM SEMANTIC FLOOR LAYOUT</b> · click: select asset, double-click: teleport</span>
      <button id="bim-size" type="button">⛶ Enlarge</button>
    </div>
    <canvas id="bim-canvas" width="280" height="205"></canvas>
    <div id="bim-legend">
      <span class="l-bad">Fault</span><span class="l-warn">Maint</span><span class="l-ok">Healthy</span><span class="l-eq">Equipment</span><span class="l-pipe">Pipe/Duct</span>
    </div>
  </div>
  <div id="status">Loading…</div>
  <div id="help">Walk: WASD / arrows (click view for mouse-look, Esc to release) · Orbit: drag / wheel</div>
  <div id="loading">Loading splat scene…</div>
</div>
<aside>
  <h2>Mission</h2>
  <div id="mission" style="margin:0 14px;color:var(--mute)">—</div>
  <h2>Assets in proximity radius</h2>
  <ul id="nearby"></ul>
  <h2>AI service copilot</h2>
  <div id="chat"></div>
  <form id="ask"><input id="q" placeholder="Ask about the selected asset…" autocomplete="off"><button>Ask</button></form>
</aside>

<script type="module">
import * as THREE from "three";
import { OrbitControls } from "three/addons/controls/OrbitControls.js";
import { PointerLockControls } from "three/addons/controls/PointerLockControls.js";
import { CSS2DRenderer, CSS2DObject } from "three/addons/renderers/CSS2DRenderer.js";
import { SparkRenderer, SplatMesh } from "@sparkjsdev/spark";

const RADIUS = 1.3, SPEED = 0.45, EYE = 0.75, MAX_LABELS = 6;
const $ = (s) => document.querySelector(s);
const view = $("#view");

// ---------- three + spark
const renderer = new THREE.WebGLRenderer({ antialias: false, powerPreference: "high-performance" });
renderer.setPixelRatio(0.85);
view.appendChild(renderer.domElement);
const labels = new CSS2DRenderer();
Object.assign(labels.domElement.style, { position: "absolute", top: 0, pointerEvents: "none" });
view.appendChild(labels.domElement);
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0f1115);
const camera = new THREE.PerspectiveCamera(70, 1, 0.02, 200);
scene.add(new SparkRenderer({ renderer }));
scene.add(new THREE.HemisphereLight(0xffffff, 0x333333, 2));

let wakeUntil = performance.now() + 3000;
const wake = (ms = 1200) => { wakeUntil = Math.max(wakeUntil, performance.now() + ms); };

function resize() {
  const { clientWidth: w, clientHeight: h } = view;
  renderer.setSize(w, h); labels.setSize(w, h);
  camera.aspect = w / h; camera.updateProjectionMatrix();
  wake(1000);
}
addEventListener("resize", resize); resize();

let splat;
function setSplat(opts) {
  if (splat) { scene.remove(splat); splat.dispose?.(); }
  splat = new SplatMesh(opts);
  splat.rotation.x = Math.PI; // pipeline frame: capture is y-down
  scene.add(splat);
  $("#loading").style.display = "grid";
  splat.initialized.then(() => { $("#loading").style.display = "none"; wake(2500); });
}
$("#file").addEventListener("change", async (e) => {
  const f = e.target.files[0]; if (!f) return;
  setSplat({ fileBytes: new Uint8Array(await f.arrayBuffer()), fileName: f.name });
  status(`Opened ${f.name} (semantic layer belongs to the bundled scene)`);
});

// ---------- scene data from the Python pipeline
const S = await (await fetch(new URLSearchParams(location.search).get("scene") || "scene.json")).json(); // ?scene= to compare pipelines
setSplat({ url: S.splat });
const floorY = S.floor_y;
const G = S.grid;
const walkable = (x, z) => {
  const i = Math.floor((x - G.origin[0]) / G.cell), j = Math.floor((z - G.origin[1]) / G.cell);
  return i >= 0 && j >= 0 && i < G.w && j < G.h && G.walkable[j * G.w + i] === "1";
};

const stateClass = (o) => !o.asset ? (o.cls && o.cls !== "CLUTTER" && o.cls !== "PIPE" ? "info" : "none") : o.id === S.target_object ? "bad"
  : o.asset.condition_state === "healthy" ? "healthy" : "warn";
const COLORS = { healthy: 0x3ecf6e, warn: 0xf2b636, bad: 0xff4d4d, info: 0x4ea1ff, none: 0x8b93a3 };

function makeObj(o, color) {
  const cls = stateClass(o);
  const box = new THREE.LineSegments(
    new THREE.EdgesGeometry(new THREE.BoxGeometry(...o.size)),
    new THREE.LineBasicMaterial({ color: color ?? COLORS[cls], transparent: true, opacity: 0.95 }));
  box.position.set(...o.center);
  const el = document.createElement("div");
  el.className = `label3d ${cls}`;
  el.textContent = o.asset ? `${o.asset.tag} · ${o.label}` : o.label;
  const lab = new CSS2DObject(el);
  lab.position.set(0, o.size[1] / 2 + 0.05, 0);
  box.visible = false;
  const obj = { ...o, cls, box, lab };
  el.onclick = () => select(obj); // the live object, so vision results and photos show up
  return obj;
}
const objs = S.objects.map((o) => makeObj(o));
const target = objs.find((o) => o.id === S.target_object);
window.demo = { objs }; // console access for inspecting vision results (o.ai, o.thumb)

// path + avatar + proximity ring
const pts = S.path.map((p) => new THREE.Vector3(p[0], floorY + 0.02, p[2]));
const route = new THREE.Line(new THREE.BufferGeometry().setFromPoints(pts),
  new THREE.LineDashedMaterial({ color: 0xffd400, dashSize: 0.08, gapSize: 0.05 }));
route.computeLineDistances();
scene.add(route);
const avatar = new THREE.Group();
const body = new THREE.Mesh(new THREE.CapsuleGeometry(0.1, 0.5, 4, 12), new THREE.MeshStandardMaterial({ color: 0x4ea1ff, emissive: 0x113355 }));
body.position.y = 0.35; avatar.add(body);
const ring = new THREE.Mesh(new THREE.RingGeometry(RADIUS - 0.02, RADIUS, 64), new THREE.MeshBasicMaterial({ color: 0x4ea1ff, transparent: true, opacity: 0.5, side: THREE.DoubleSide }));
ring.rotation.x = -Math.PI / 2; ring.position.y = 0.03; avatar.add(ring);
avatar.position.copy(pts[0]).setY(floorY);
scene.add(avatar);

// labels come from vision_labels.json / Gemini, so they are text, never markup
const esc = (t) => String(t ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);
$("#mission").innerHTML = `Target <b style="color:var(--bad)">${target.asset.tag} [${target.asset.asset_id}]</b> — ${target.asset.asset_class}, ${target.asset.issue_code ?? ""} · health ${target.asset.health_score}<br>
${S.objects.length} framed objects · ${S.objects.filter((o) => o.asset).length} mapped to Excel · route ${S.path.length} waypoints`;

// ---------- camera modes
const orbit = new OrbitControls(camera, renderer.domElement);
orbit.enabled = false;
orbit.addEventListener("change", () => wake(600));
const fps = new PointerLockControls(camera, renderer.domElement);
fps.addEventListener("change", () => wake(600));
let mode = "follow";
document.querySelectorAll("[data-mode]").forEach((b) => b.onclick = () => setMode(b.dataset.mode));
function setMode(m) {
  mode = m;
  document.querySelectorAll("[data-mode]").forEach((b) => b.setAttribute("aria-pressed", b.dataset.mode === m));
  orbit.enabled = m === "orbit";
  body.visible = m !== "walk"; // first person: don't render own capsule
  if (m === "orbit") { // bird's-eye overview of the nav grid
    const cx = G.origin[0] + G.w * G.cell / 2, cz = G.origin[1] + G.h * G.cell / 2;
    orbit.target.set(cx, floorY, cz); camera.position.set(cx, S.ceiling_y - 0.15, cz + G.h * G.cell * 0.45); // stay under the ceiling splats
  }
  if (m === "walk") {
    playing = false;
    camera.position.set(avatar.position.x, floorY + EYE, avatar.position.z);
    const ahead = pts[Math.min(seg + 1, pts.length - 1)];
    camera.lookAt(ahead.x, floorY + EYE, ahead.z); // level gaze toward the next waypoint
  }
  if (m !== "walk" && fps.isLocked) fps.unlock();
  wake(1200);
}
renderer.domElement.addEventListener("click", () => mode === "walk" && fps.lock());
const keys = {};
addEventListener("keydown", (e) => { keys[e.code] = true; wake(600); });
addEventListener("keyup", (e) => {
  keys[e.code] = false;
  if (e.code === "ArrowUp") keys.KeyW = false;
  if (e.code === "ArrowDown") keys.KeyS = false;
  wake(600);
});

// ---------- mission playback
let playing = false, seg = 0, arrived = false;
$("#play").onclick = () => {
  if (arrived) { seg = 0; arrived = false; avatar.position.copy(pts[0]).setY(floorY); }
  playing = !playing; setMode("follow");
  $("#play").textContent = playing ? "⏸ Pause" : "▶ Resume";
  wake(1500);
};
let showAll = false;
$("#all").onclick = (e) => { showAll = !showAll; e.target.setAttribute("aria-pressed", showAll); proximity(); wake(800); };

function stepMission(dt) {
  if (!playing || arrived) return;
  let move = SPEED * dt;
  while (move > 0 && seg < pts.length - 1) {
    const to = pts[seg + 1].clone().setY(floorY);
    const d = to.distanceTo(avatar.position);
    if (d <= move) { avatar.position.copy(to); seg++; move -= d; }
    else { avatar.position.lerp(to, move / d); avatar.lookAt(to.x, floorY, to.z); move = 0; }
  }
  if (seg >= pts.length - 1) { arrived = true; playing = false; $("#play").textContent = "↺ Replay"; onArrive(); }
}

function stepWalk(dt) {
  if (mode !== "walk") return;
  // arrow keys turn too, for embedded views where Pointer Lock is refused
  if (keys.ArrowLeft) { camera.rotateOnWorldAxis(camera.up, 1.6 * dt); wake(400); }
  if (keys.ArrowRight) { camera.rotateOnWorldAxis(camera.up, -1.6 * dt); wake(400); }
  if (keys.ArrowUp) keys.KeyW = true; if (keys.ArrowDown) keys.KeyS = true;
  const v = 1.0 * dt, f = new THREE.Vector3(), r = new THREE.Vector3();
  camera.getWorldDirection(f); f.y = 0; f.normalize(); r.crossVectors(f, camera.up);
  const d = new THREE.Vector3();
  if (keys.KeyW) d.add(f); if (keys.KeyS) d.sub(f); if (keys.KeyD) d.add(r); if (keys.KeyA) d.sub(r);
  if (!d.lengthSq()) return;
  wake(500);
  d.normalize().multiplyScalar(v);
  const p = camera.position;
  // collide against the nav grid: slide along axes that stay walkable
  if (walkable(p.x + d.x, p.z)) p.x += d.x;
  if (walkable(p.x, p.z + d.z)) p.z += d.z;
  avatar.position.set(p.x, floorY, p.z);
}

function followCam() {
  if (mode !== "follow") return;
  const back = new THREE.Vector3(0, 0, -1).applyQuaternion(avatar.quaternion);
  const want = avatar.position.clone().addScaledVector(back, 1.4).add(new THREE.Vector3(0, 1.0, 0));
  if (camera.position.distanceToSquared(want) > 1e-4) wake(400);
  camera.position.lerp(want, 0.08);
  camera.lookAt(avatar.position.x, floorY + 0.5, avatar.position.z);
}

// ---------- proximity display & fragment deduplication
let lastNear = "", lastPx = NaN, lastPz = NaN, lastShowAll = false, lastSelId = "";
const activeLabs = new Set(), activeBoxes = new Set();

// Flag sub-fragments of multi-part objects (e.g. multiple bounding boxes on same equipment)
for (const o of objs) {
  if (o.asset) continue;
  const vid = o.ai?.id ?? o.vision_id ?? o.cls;
  const vol = o.size[0] * o.size[1] * o.size[2];
  for (const other of objs) {
    if (other === o) continue;
    const otherVid = other.ai?.id ?? other.vision_id ?? other.cls;
    if (otherVid === vid || ((vid === "APPLIANCE" || vid === "TANK" || vid === "CABINET") && otherVid === vid)) {
      const otherVol = other.size[0] * other.size[1] * other.size[2];
      if (otherVol > vol * 1.8) {
        const dist = Math.hypot(o.center[0] - other.center[0], o.center[1] - other.center[1], o.center[2] - other.center[2]);
        if (dist < 0.85) { o.isFragment = true; break; }
      }
    }
  }
}

const isNoise = (o) => {
  if (o.asset || o === target || o === selected) return false;
  if (o.isFragment) return true;
  const vid = o.ai?.id ?? o.vision_id ?? o.cls;
  if (vid === "STRUCTURE" || vid === "PIPE" || vid === "DUCT" || vid === "LAMP") return true;
  const maxDim = Math.max(...o.size), minDim = Math.min(...o.size);
  if (minDim < 0.06 && maxDim < 0.25) return true;
  return false;
};

function proximity() {
  const p = avatar.position;
  const selId = selected?.id ?? "";
  if (lastNear !== "" && showAll === lastShowAll && selId === lastSelId && Math.hypot(p.x - lastPx, p.z - lastPz) < 0.02) return;
  lastPx = p.x; lastPz = p.z; lastShowAll = showAll; lastSelId = selId;
  const near = [];
  for (const o of objs) {
    const hide = isNoise(o);
    const d = Math.hypot(o.center[0] - p.x, o.center[2] - p.z);
    const on = (!hide && (showAll || d < RADIUS)) || o === target || o === selected;
    o.box.visible = on;
    if (on && !activeBoxes.has(o)) { scene.add(o.box); activeBoxes.add(o); }
    else if (!on && activeBoxes.has(o)) { scene.remove(o.box); activeBoxes.delete(o); }
    if (!hide && d < RADIUS) near.push([d, o]);
  }
  // Excel-mapped assets first, then by distance; only attach CSS2DObject to the few visible labels for high FPS
  near.sort((a, b) => (!a[1].asset - !b[1].asset) || a[0] - b[0]);
  const wantLabs = new Set([target, ...(selected && !isNoise(selected) ? [selected] : []), ...near.slice(0, MAX_LABELS).map(([, o]) => o)]);
  for (const o of activeLabs) if (!wantLabs.has(o)) { o.box.remove(o.lab); activeLabs.delete(o); }
  for (const o of wantLabs) if (!activeLabs.has(o)) { o.box.add(o.lab); activeLabs.add(o); }
  drawBimMap();
  wake(400);
  const key = near.map(([, o]) => o.id).join() + ":" + selId;
  if (key === lastNear) return;
  lastNear = key;
  $("#nearby").innerHTML = near.map(([d, o]) => {
    const tagChip = o.asset ? `${o === target ? "FAULT" : o.asset.condition_state} · ${o.asset.health_score}` : (o.ai?.id ?? o.vision_id ?? o.cls ?? "SCENE");
    return `<li data-id="${o.id}"><span>${o.asset ? `<b>${o.asset.tag}</b> ` : `<code style="font-size:11px;color:var(--mute)">${o.id}</code> `}${esc(nameOf(o))}</span>
    <span><span class="chip ${esc(o.cls)}">${esc(tagChip)}</span> ${d.toFixed(1)}</span></li>`;
  }).join("")
    || `<li style="color:var(--mute)">No assets within ${RADIUS} m</li>`;
  $("#nearby").querySelectorAll("li[data-id]").forEach((li) => li.onclick = () => select(objs.find((o) => o.id === li.dataset.id)));
}

// ---------- copilot & Gemini Vision inspector (works for both Excel and non-Excel industrial objects)
let selected = target, history = [];
const md = (t) => esc(t)
  .replace(/\*\*(.+?)\*\*/g, "<b>$1</b>").replace(/`([^`]+)`/g, "<code>$1</code>").replace(/(^|\s)_(.+?)_(?=\s|$)/g, "$1<i>$2</i>")
  .replace(/\[((?:ASSET|EVT|WO|CASE|DOC|DQ|OBJ)-[^\]]+)\]/g, '<span class="cite">[$1]</span>').replace(/\n/g, "<br>");
function say(role, text) {
  const div = document.createElement("div");
  div.className = `msg ${role}`; div.innerHTML = md(text);
  $("#chat").append(div); $("#chat").scrollTop = 1e9;
  return div;
}
async function copilot(question) {
  if (!selected) return;
  const h = history;
  const wait = say("bot", "…Gemini Copilot analysing industrial object");
  const payload = selected.asset
    ? { asset_id: selected.asset.asset_id, question, history: h }
    : { object_id: selected.id, question: question ?? "Inspect this object in the boiler room: what it is, its key parameters, and what a technician should check.", history: h };
  const r = await fetch("api/copilot", { method: "POST", headers: { "Content-Type": "application/json" },
    body: JSON.stringify(payload) })
    .then((r) => r.json()).catch((e) => ({ error: `Copilot unavailable: ${e.message}` }));
  wait.innerHTML = md(r.answer ?? r.error) + `<div style="color:var(--mute);font-size:11px;margin-top:4px">source: ${r.mode ?? "error"}</div>`;
  if (r.answer) h.push({ role: "user", content: payload.question ?? "ARRIVED: run full diagnosis." }, { role: "assistant", content: r.answer });
}
async function geminiClassify(o, btn) {
  if (btn) { btn.disabled = true; btn.textContent = "…Gemini Vision"; }
  try {

async function geminiScanScene(btn) {

    scanCanvas.width = 768; scanCanvas.height = 512;
    scanCanvas.getContext("2d").drawImage(renderer.domElement, 0, 0, 768, 512);
    const view_b64 = scanCanvas.toDataURL("image/jpeg", 0.82);
    hidden.forEach(([m, v]) => (m.visible = v));
    labels.domElement.style.visibility = "";

    for (const o of objs) {

        const px = (p.x * 0.5 + 0.5) * 1000, py = (-p.y * 0.5 + 0.5) * 1000;
        x0 = Math.min(x0, px); y0 = Math.min(y0, py); x1 = Math.max(x1, px); y1 = Math.max(y1, py);
      }
      cands.push({
        id: o.id,
        box_2d: [Math.max(0, Math.round(y0)), Math.max(0, Math.round(x0)), Math.min(1000, Math.round(y1)), Math.min(1000, Math.round(x1))],
        size_m: o.size.map((v) => +v.toFixed(2)),
        elevation_m: +(o.center[1] - o.size[1] / 2 - floorY).toFixed(2),
        current_label: nameOf(o),

    cands.sort((a, b) => (b.box_2d[2] - b.box_2d[0]) * (b.box_2d[3] - b.box_2d[1]) - (a.box_2d[2] - a.box_2d[0]) * (a.box_2d[3] - a.box_2d[1]));

        b.innerHTML = `<span>${d.object_id ? `${d.object_id} · ` : ""}${esc(d.label)} (${Math.round(d.score * 100)}%)</span>`;
        b.title = d.reason || d.label;

        overlay.appendChild(b);

      say("bot", `✨ **Gemini Vision — current view (${r.detections.length} objects):**\n${summary || "No objects detected"}`);

    }

  for (let j = 0; j < G.h; j++) for (let i = 0; i < G.w; i++) {
    if (G.walkable[j * G.w + i] === "1") bctx.fillRect(Math.floor(i * G.cell * sx), Math.floor(j * G.cell * sz), cw, ch);
  }

    bctx.fillText("AREA-03 PUMP MANIFOLD", W - 135, H * 0.72);
    bctx.fillText("AREA-04 SERVICE CORRIDOR", W * 0.34, H - 14);

  // 3) Pipe & duct network + non-Excel equipment footprints
  for (const o of objs) {
    if (o.asset || (o.ai?.id ?? o.vision_id) === "STRUCTURE") continue;
    const vid = o.ai?.id ?? o.vision_id ?? o.cls;
    bctx.fillStyle = (vid === "PIPE" || vid === "DUCT") ? "#24547a99" : "#3a7ca8aa";
    const x0 = wx(o.center[0] - o.size[0] / 2), z0 = wz(o.center[2] - o.size[2] / 2);
    bctx.fillRect(x0, z0, Math.max(2, o.size[0] * sx), Math.max(2, o.size[2] * sz));

  for (const o of objs) {
    if (!o.asset) continue;

    const x0 = wx(o.center[0] - o.size[0] / 2), z0 = wz(o.center[2] - o.size[2] / 2);
    const rw = Math.max(bimLarge ? 7 : 5, o.size[0] * sx), rh = Math.max(bimLarge ? 7 : 5, o.size[2] * sz);
    bctx.fillStyle = col + "55"; bctx.strokeStyle = col; bctx.lineWidth = o === selected ? 2.2 : 1.3;
    bctx.fillRect(x0, z0, rw, rh); bctx.strokeRect(x0, z0, rw, rh);
    if (bimLarge || o === target || o === selected || o.asset.condition_state !== "healthy") {
      bctx.font = `${o === target || o === selected ? "700" : "500"} ${bimLarge ? 10 : 8}px system-ui`;
      bctx.fillStyle = o === target ? "#ff8080" : "#e6e8ec";
      bctx.fillText(o.asset.tag, wx(o.center[0]) + 4, wz(o.center[2]) + 3);
    }
  }
  // 6) Selected object highlight
  if (selected) {
    bctx.strokeStyle = "#ffffff"; bctx.lineWidth = 1.8;
    bctx.beginPath(); bctx.arc(wx(selected.center[0]), wz(selected.center[2]), bimLarge ? 8 : 6, 0, Math.PI * 2); bctx.stroke();
  }

  const ax = wx(avatar.position.x), az = wz(avatar.position.z);

  bctx.beginPath(); bctx.arc(ax, az, RADIUS * sx, 0, Math.PI * 2); bctx.stroke();
  const dir = new THREE.Vector3(); camera.getWorldDirection(dir);

}

async function captureBox(o) {
  // look at the box from the nearest aisle cell: the side a technician would actually see
  const c = new THREE.Vector3(...o.center);
  let best = walkCells[0], bd = Infinity;
  for (const w of walkCells) { const d = (w[0] - c.x) ** 2 + (w[1] - c.z) ** 2; if (d < bd) { bd = d; best = w; } }
  const dir = new THREE.Vector3(best[0] - c.x, 0, best[1] - c.z);
  if (dir.lengthSq() < 1e-6) dir.set(0, 0, 1);
  dir.normalize();
  const size = Math.max(...o.size);
  capCam.aspect = renderer.domElement.width / renderer.domElement.height;
  // splats blur up close: never closer than 0.8 m, and keep the object at ~half the view height
  capCam.position.copy(c).addScaledVector(dir, Math.max(0.8, size / Math.tan(THREE.MathUtils.degToRad(capCam.fov / 2))));
  capCam.lookAt(c);
  capCam.updateProjectionMatrix();
  for (let k = 0; k < 3; k++) { renderer.render(scene, capCam); await nextFrame(); } // let Spark re-sort splats for this view
  renderer.render(scene, capCam);
  // crop the projected box (square, 80% context) and read pixels in the same task, before the buffer is cleared
  const W = renderer.domElement.width, H = renderer.domElement.height;
  let x0 = W, y0 = H, x1 = 0, y1 = 0;
  for (const sx of [-0.5, 0.5]) for (const sy of [-0.5, 0.5]) for (const sz of [-0.5, 0.5]) {
    const p = new THREE.Vector3(c.x + sx * o.size[0], c.y + sy * o.size[1], c.z + sz * o.size[2]).project(capCam);
    const px = (p.x + 1) / 2 * W, py = (1 - p.y) / 2 * H;
    x0 = Math.min(x0, px); x1 = Math.max(x1, px); y0 = Math.min(y0, py); y1 = Math.max(y1, py);
  }
  const side = Math.min(Math.max((x1 - x0) * 1.8, (y1 - y0) * 1.8, H * 0.3), W, H); // context helps CLIP on small parts
  const cx = Math.min(Math.max((x0 + x1) / 2, side / 2), W - side / 2), cy = Math.min(Math.max((y0 + y1) / 2, side / 2), H - side / 2);
  sctx.drawImage(renderer.domElement, cx - side / 2, cy - side / 2, side, side, 0, 0, 224, 224);
  return {
    bx0: Math.round((x0 - (cx - side / 2)) / side * 224),
    by0: Math.round((y0 - (cy - side / 2)) / side * 224),
    bx1: Math.round((x1 - (cx - side / 2)) / side * 224),
    by1: Math.round((y1 - (cy - side / 2)) / side * 224),
  };
}
window.__app = { scene, camera, renderer, objs, captureBox, select, setMode, VOC, S, snap, sctx, labels, route, avatar };
window.__captureBatch = async (ids) => {
  capturing = true;
  const hidden = [route, avatar, ...objs.map((x) => x.box)].map((m) => [m, m.visible]);
  hidden.forEach(([m]) => (m.visible = false));
  labels.domElement.style.visibility = "hidden";
  const out = {};
  for (const id of ids) {
    const o = objs.find((x) => x.id === id);
    if (!o) continue;
    const rect = await captureBox(o);
    out[id] = { b64: snap.toDataURL("image/jpeg", 0.88), rect };
  }
  hidden.forEach(([m, v]) => (m.visible = v));
  labels.domElement.style.visibility = "";
  capturing = false;
  return out;
};

const MODEL = VOC.model;
let TJS, vision, textModel, tokenizer, processor, clipDevice, textEmb;
const unit = (v) => { const n = Math.hypot(...v); return v.map((x) => x / n); };
const meanUnit = (vs) => { const m = new Float32Array(vs[0].length); vs.forEach((v) => v.forEach((x, i) => (m[i] += x))); return unit(m); };
const dot = (a, b) => { let s = 0; for (let k = 0; k < a.length; k++) s += a[k] * b[k]; return s; };
const rows = (t) => { const d = t.dims.at(-1); return Array.from({ length: t.dims[0] }, (_, i) => unit(Float32Array.from(t.data.subarray(i * d, (i + 1) * d)))); };
async function loadModels() {
  TJS ??= await import("https://cdn.jsdelivr.net/npm/@huggingface/transformers@4.3.2/+esm");
  if (vision) return;
  // fp16 on WebGPU where supported (q8 dequantises slowly there); weights are cached by the browser after the first run
  const f16 = !!(await navigator.gpu?.requestAdapter())?.features.has("shader-f16");
  const opts = (device) => ({ device, dtype: device === "webgpu" && f16 ? "fp16" : "q8",
    progress_callback: (p) => p.status === "progress_total" && status(`Downloading CLIP… ${Math.round(p.progress)}%`) });
  const load = async (device) => [await TJS.CLIPVisionModelWithProjection.from_pretrained(MODEL, opts(device)),
                                  await TJS.CLIPTextModelWithProjection.from_pretrained(MODEL, opts(device))];
  clipDevice = navigator.gpu ? "webgpu" : "wasm";
  [vision, textModel] = await load(clipDevice).catch(() => load((clipDevice = "wasm")));
  [tokenizer, processor] = await Promise.all([TJS.AutoTokenizer.from_pretrained(MODEL), TJS.AutoProcessor.from_pretrained(MODEL)]);
  // prompt ensemble: one text embedding per class = mean over its prompts x templates (+8 points on tests/vision_eval.json)
  textEmb = [];
  for (const c of VOC.classes) {
    const texts = c.prompts.flatMap((p) => VOC.templates.map((t) => t.replace("{}", p)));
    textEmb.push(meanUnit(rows((await textModel(tokenizer(texts, { padding: true, truncation: true }))).text_embeds)));
  }
}
async function embed(raws) { // L2-normalised CLIP image embeddings, in batches the GPU handles comfortably
  const out = [];
  for (let i = 0; i < raws.length; i += 16) out.push(...rows((await vision(await processor(raws.slice(i, i + 16)))).image_embeds));
  return out;
}
// visual examples per class: hand-labelled video tiles, already embedded while indexing the video
async function buildPrototypes(tiles) {
  const idx = Object.fromEntries(VOC.classes.map((c, i) => [c.id, i])), per = VOC.classes.map(() => []);
  const key = (f, x, y, s) => `${f}:${Math.round(x / 10)}:${Math.round(y / 10)}:${s}`; // x may differ by 1 px (rounding)
  const byKey = new Map(tiles.map((t) => [key(t.f, t.x, t.y, t.s), t.e]));
  const pt = await (await fetch("prototype_tiles.json")).json();
  for (const [c, list] of Object.entries(pt.tiles)) for (const [f, x, y] of list) {
    const e = byKey.get(key(f, x, y, pt.size));
    if (e && c in idx) per[idx[c]].push(e);
  }
  return { protos: per.map((l) => (l.length ? meanUnit(l) : null)), counts: Object.fromEntries(VOC.classes.map((c, i) => [c.id, per[i].length])) };
}
function classify(v, protos) { // text similarity + small prototype bonus -> softmax over classes
  const ps = protos.map((p) => (p ? dot(p, v) : null)), have = ps.filter((x) => x != null);
  const mu = have.length ? have.reduce((a, b) => a + b) / have.length : 0;
  const s = VOC.classes.map((_, i) => 100 * (dot(textEmb[i], v) + VOC.proto_weight * ((ps[i] ?? mu) - mu)));
  const mx = Math.max(...s), ex = s.map((x) => Math.exp(x - mx)), z = ex.reduce((a, b) => a + b);
  const best = ex.indexOf(Math.max(...ex)), c = VOC.classes[best];
  return { id: c.id, label: c.name, kind: c.kind, asset_class: c.asset_class, score: +(ex[best] / z).toFixed(3) };
}
const loadImg = (src) => new Promise((ok, err) => Object.assign(new Image(), { onload() { ok(this); }, onerror: err, src }));
const tile = Object.assign(document.createElement("canvas"), { width: 224, height: 224 });
const tctx = tile.getContext("2d", { willReadFrequently: true });
function tileRaw(img, t) { tctx.drawImage(img, t.x, t.y, t.s, t.s, 0, 0, 224, 224); return TJS.RawImage.fromCanvas(tile); }

async function indexVideo() {
  // each frame -> 1 row of full-height squares + 2 rows of half-height squares, overlapping, so small parts get a close tile
  const idx = await (await fetch("frames/index.json")).json();
  const first = await loadImg(`frames/${idx.files[0]}`);
  const W = first.naturalWidth, H = first.naturalHeight;
  videoIndex = { files: idx.files, w: W, h: H };
  const spots = (len, s, n) => Array.from({ length: n }, (_, i) => Math.round(n === 1 ? 0 : (i * (len - s)) / (n - 1)));
  const layout = [];
  for (const [s, nx, ny] of [[H, 3, 1], [Math.round(H / 2), 5, 2]])
    for (const x of spots(W, s, nx)) for (const y of spots(H, s, ny)) layout.push({ x, y, s });
  // embeddings cost ~1 s/frame (fp16 on WebGPU): keep them in the Cache API, keyed by the source video's hash
  const key = `/tile-embeddings-v3-${MODEL.replace(/\W/g, "_")}-${idx.source}-${idx.files.length}-${W}x${H}`;
  const cache = await caches.open("valmet-demo");
  const hit = await cache.match(key);
  if (hit) {
    const buf = new Float32Array(await hit.arrayBuffer()), d = buf.length / (idx.files.length * layout.length);
    return idx.files.flatMap((_, f) => layout.map((t, k) => ({ f, ...t, e: buf.subarray((f * layout.length + k) * d, (f * layout.length + k + 1) * d) })));
  }
  const tiles = [];
  for (let f = 0; f < idx.files.length; f++) {
    const img = await loadImg(`frames/${idx.files[f]}`);
    const embs = await embed(layout.map((t) => tileRaw(img, t)));
    embs.forEach((e, k) => tiles.push({ f, ...layout[k], e }));
    status(`Indexing walk-through video ${f + 1}/${idx.files.length} (once; cached afterwards)…`);
  }
  const all = new Float32Array(tiles.length * tiles[0].e.length);
  tiles.forEach((t, i) => all.set(t.e, i * t.e.length));
  await cache.put(key, new Response(all.buffer));
  return tiles;
}

// frame list + size up front, so cached photo matches render without re-running the pass
fetch("frames/index.json").then((r) => (r.ok ? r.json() : null)).then(async (idx) => {
  if (!idx || videoIndex) return;
  const im = await loadImg(`frames/${idx.files[0]}`);
  videoIndex ??= { files: idx.files, w: im.naturalWidth, h: im.naturalHeight };
}).catch(() => {});

$("#ai").onclick = async () => {
  const btn = $("#ai");
  btn.disabled = true;
  let hidden = [];
  try {
    status("Loading CLIP model in the browser…");
    await loadModels();
    const device = clipDevice, t0 = performance.now();
    const tiles = await indexVideo();
    const { protos, counts: protoCounts } = await buildPrototypes(tiles);

    // 1) render every 3D frame from the aisle, label it and embed it
    capturing = true;
    hidden = [route, avatar, ...objs.map((o) => o.box)].map((m) => [m, m.visible]);
    hidden.forEach(([m]) => (m.visible = false));
    labels.domElement.style.visibility = "hidden";
    for (let i = 0; i < objs.length; i += 8) {
      const batch = objs.slice(i, i + 8), raws = [];
      for (const o of batch) {
        await captureBox(o);
        o.thumb = snap.toDataURL("image/jpeg", 0.7);
        raws.push(TJS.RawImage.fromCanvas(snap));
      }
      (await embed(raws)).forEach((e, j) => { batch[j].emb = e; batch[j].render = classify(e, protos); });
      status(`Rendering + labelling 3D frames ${Math.min(i + 8, objs.length)}/${objs.length} on ${device}…`);
    }
    hidden.forEach(([m, v]) => (m.visible = v));
    labels.domElement.style.visibility = "";
    capturing = false;

    // 2) match each render to a video tile with CSLS (hubness-corrected cosine): with plain cosine a few bland
    //    tiles (blank wall) are the "nearest" photo for every blurry render
    const N = objs.length, T = tiles.length, D = tiles[0].e.length, KNN = 10;
    const sim = new Float32Array(N * T);
    objs.forEach((o, i) => tiles.forEach((t, j) => { let s = 0; for (let k = 0; k < D; k++) s += t.e[k] * o.emb[k]; sim[i * T + j] = s; }));
    const meanTop = (vals) => { vals.sort((a, b) => b - a); let s = 0; for (let k = 0; k < KNN; k++) s += vals[k]; return s / KNN; };
    const rObj = objs.map((_, i) => meanTop(sim.slice(i * T, (i + 1) * T)));
    const rTile = tiles.map((_, j) => meanTop(Float32Array.from({ length: N }, (_, i) => sim[i * T + j])));
    objs.forEach((o, i) => {
      let bj = 0, bc = -Infinity;
      for (let j = 0; j < T; j++) { const c = 2 * sim[i * T + j] - rObj[i] - rTile[j]; if (c > bc) { bc = c; bj = j; } }
      const t = tiles[bj];
      o.photo = { f: t.f, x: t.x, y: t.y, s: t.s, sim: +sim[i * T + bj].toFixed(3), csls: +bc.toFixed(3) };
      if (bc >= SIM_MIN) Object.assign(o.photo, classify(t.e, protos)); // the sharp tile is already embedded
    });
    const matched = objs.filter((o) => o.photo.csls >= SIM_MIN);
    objs.forEach((o) => { o.final = null; applyAI(o, decide(o)); });
    const saved = await fetch("api/vision", { method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ scene_id: S.scene_id, model: MODEL, labels: Object.fromEntries(objs.filter((o) => o.render)
        .map((o) => [o.id, { render: o.render, photo: o.photo, final: o.ai }])) }) }).then((r) => r.ok).catch(() => false);

    const confident = objs.filter(sure), byRender = objs.filter((o) => o.render?.score >= MIN_SCORE).length, counts = {};
    confident.forEach((o) => (counts[o.ai.label] = (counts[o.ai.label] || 0) + 1));
    status(`AI labelled ${confident.length}/${objs.length} frames (render only: ${byRender}) · ${matched.length} matched to video · ` +
      `${((performance.now() - t0) / 1000).toFixed(0)} s on ${device}${saved ? " · saved" : " · NOT saved"}`);
    say("bot", `**Vision pass done** (${MODEL.split("/").pop()}, ${device}). Prototypes: ` +
      Object.entries(protoCounts).filter(([, n]) => n).map(([k, n]) => `${k} ${n}`).join(", ") +
      `. ${matched.length}/${objs.length} frames matched to a real video photo. Confident labels ${byRender} → **${confident.length}**: ` +
      Object.entries(counts).sort((a, b) => b[1] - a[1]).map(([k, v]) => `${k} ×${v}`).join(", ") +
      `. Others are shown as “${UNKNOWN}”.`);
    lastNear = "";
  } catch (e) {
    status(`AI labelling failed: ${e.message}`);
  } finally {
    hidden.forEach(([m, v]) => (m.visible = v));
    labels.domElement.style.visibility = "";
    capturing = false;
    btn.disabled = false;
  }
};

// ---------- loop
function status(t) { $("#status").textContent = t; }
status("Ready — press Start mission");
setMode("follow");
const clock = new THREE.Clock();
renderer.setAnimationLoop(() => {
  const dt = Math.min(clock.getDelta(), 0.1);
  if (capturing) return; // the vision pass owns the canvas
  stepMission(dt); stepWalk(dt); followCam(); proximity();
  if (orbit.enabled) orbit.update();
  if (!playing && performance.now() > wakeUntil) return;
  target.box.material.opacity = 0.55 + 0.45 * Math.sin(performance.now() / 200);
  if (playing) status(`En route to ${target.asset.tag} · ${avatar.position.distanceTo(pts.at(-1)).toFixed(1)} m left`);
  renderer.render(scene, camera); labels.render(scene, camera);
});
</script>
